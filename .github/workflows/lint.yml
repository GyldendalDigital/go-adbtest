name: Lint

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned to the module's own baseline rather than stable. golangci-lint is
      # pinned below, and its typechecker cannot read a standard library newer
      # than the Go it was built with: Go 1.27 becoming stable broke this job on
      # master with errors inside crypto/internal/randutil, nothing to do with
      # this repository's code. The test job in ci.yml pins the same way.
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
