name: CI

on:
  push:
    branches: [master]
  # Every pull request, whatever it targets. Filtering on master meant a pull
  # request stacked on another branch ran no checks at all and merged unverified.
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'

      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Test Android integration example without an SDK
        run: go test -count=1 -tags=android_integration ./examples

      - name: Upload coverage
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Build
        run: go build ./...

      # CI runs on Linux only, so nothing else compiles the build-tagged files.
      # The doctor's free-space measurement has a linux||darwin implementation
      # and a fallback for every other host, and the darwin path differs in a
      # way the Linux build cannot catch: Statfs_t.Bsize is int64 on Linux and
      # uint32 on macOS.
      # Both: go build links the commands, and go vet type-checks _test.go
      # files, which go build skips - so a darwin-only breakage in a
      # build-tagged test would otherwise ship silently.
      - name: Cross-compile the build-tagged hosts
        run: |
          for target in darwin/arm64 darwin/amd64 windows/amd64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" go build ./...
            GOOS="${target%/*}" GOARCH="${target#*/}" go vet ./...
          done

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  govulncheck:
    name: Govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          repo-checkout: false
          go-version-input: stable
          go-package: ./...
